name: Update property costs

on:
  schedule:
    - cron: "17 3 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: property-cost-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Scripts/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement Scripts/requirements.txt

      - name: Run generator tests
        run: python -m unittest Scripts/test_update_property_costs.py

      - name: Generate quarterly catalog
        run: python Scripts/update_property_costs.py --check-urls

      - name: Validate public catalog
        run: python Scripts/validate_property_costs.py

      - name: Add public contract and source registry
        run: |
          cp Data/property-costs-v1.schema.json public/v1/property-costs-v1.schema.json
          cp Data/property-cost-sources.json public/v1/sources.json

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-costs-${{ github.run_number }}
          path: |
            public/v1/property-costs.json
            public/v1/latest.json
            public/v1/history/
            public/v1/property-costs-v1.schema.json
            public/v1/sources.json
          retention-days: 90

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
